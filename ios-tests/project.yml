name: SketchCanvasTests

configs:
  Debug: debug
  Release: release

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    NODE_PATH: $(SRCROOT)/../example/node_modules
    IOS_DEVELOPMENT_TEAM: ""
    DEVELOPMENT_TEAM: $(IOS_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
    "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
    "CODE_SIGNING_REQUIRED[sdk=iphoneos*]": YES
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO

targets:
  SketchCanvasTestHost:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: TestHost
    settings:
      base:
        PRODUCT_NAME: SketchCanvasTestHost
        PRODUCT_BUNDLE_IDENTIFIER: com.apollohg.SketchCanvasTestHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SketchCanvasTestHost
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

  SketchCanvasTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.4"
    hostApplication: SketchCanvasTestHost
    sources:
      - path: ../ios
        excludes:
          - SketchCore.xcframework
          - sketch_coreFFI
      - path: Tests
      - path: ../fixtures/goldens
        type: folder
        buildPhase: resources
      - path: ../fixtures/backgrounds
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SketchCanvasTests
        PRODUCT_BUNDLE_IDENTIFIER: com.apollohg.SketchCanvasTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SketchCanvasTestHost
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SketchCanvasTestHost.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SketchCanvasTestHost
        BUNDLE_LOADER: $(TEST_HOST)
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/Frameworks"
          - "@executable_path/Frameworks"
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ios/sketch_coreFFI
        OTHER_SWIFT_FLAGS:
          - $(inherited)
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/../ios/sketch_coreFFI/module.modulemap
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ios/sketch_coreFFI
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - $(inherited)
          - $(SRCROOT)/../ios/SketchCore.xcframework/ios-arm64/libsketch_core.a
        "OTHER_LDFLAGS[sdk=iphonesimulator*]":
          - $(inherited)
          - $(SRCROOT)/../ios/SketchCore.xcframework/ios-arm64_x86_64-simulator/libsketch_core.a
    dependencies:
      - target: SketchCanvasTestHost

schemes:
  SketchCanvasTests:
    build:
      targets:
        SketchCanvasTestHost: all
        SketchCanvasTests: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: SketchCanvasTests
