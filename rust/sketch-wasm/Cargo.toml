[package]
name = "sketch-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "sketch_wasm"

[dependencies]
sketch-core = { path = "../sketch-core" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
