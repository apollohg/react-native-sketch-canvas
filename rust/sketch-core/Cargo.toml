[package]
name = "sketch-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "sketch_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
usvg = { version = "0.50", default-features = false }
uniffi = { version = "0.29", optional = true }

[dev-dependencies]
resvg = { version = "0.50", default-features = false }
tiny-skia = "0.11"

[features]
default = []
ffi = ["dep:uniffi"]
cli = ["ffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]
